name: snapshot

# Phase 0: the half of collection that is reachable from anywhere.
#
# BMC's roads API and portal refuse foreign cloud runners, so they are collected
# from a VM in asia-south1 instead (ADR 0015). What remains here answers from any
# network: the storm-water drain API and the Government Resolution mirror. The
# overlap with the VM is deliberate redundancy — unchanged bytes cost one
# fetch_log row and nothing else.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   R2_BUCKET_URL, R2_BUCKET_NAME, R2_ACCESS_KEY, R2_SECRET_ACCESS_KEY,
#   POSTGRESQL_CONNECTION, POSTGRES_CA (the CA certificate, pasted whole),
#   NOTIFY_WEBHOOK_URL (optional)

on:
  schedule:
    # 08:30 IST — deliberately not 02:30, so this and the VM are not a single
    # simultaneous point of failure.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Write the database CA certificate
        env:
          POSTGRES_CA: ${{ secrets.POSTGRES_CA }}
        run: |
          if [ -z "$POSTGRES_CA" ]; then
            echo "POSTGRES_CA is not set; TLS verification cannot be enabled." >&2
            exit 1
          fi
          printf '%s\n' "$POSTGRES_CA" > ca.pem
          chmod 600 ca.pem

      - name: Apply migrations
        env:
          POSTGRESQL_CONNECTION: ${{ secrets.POSTGRESQL_CONNECTION }}
          POSTGRES_CA_PATH: ca.pem
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: go run ./cmd/ingest migrate

      - name: Snapshot the sources reachable from anywhere
        env:
          POSTGRESQL_CONNECTION: ${{ secrets.POSTGRESQL_CONNECTION }}
          POSTGRES_CA_PATH: ca.pem
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          TRACESARKAR_TIER: personal
        # Named explicitly: bmc_roads_api would only time out from here.
        run: go run ./cmd/ingest run bmc_swd_api

      - name: Watch for new Government Resolutions
        env:
          POSTGRESQL_CONNECTION: ${{ secrets.POSTGRESQL_CONNECTION }}
          POSTGRES_CA_PATH: ca.pem
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: go run ./cmd/ingest watch --limit 40

      - name: Collection status
        if: always()
        env:
          POSTGRESQL_CONNECTION: ${{ secrets.POSTGRESQL_CONNECTION }}
          POSTGRES_CA_PATH: ca.pem
          R2_BUCKET_URL: ${{ secrets.R2_BUCKET_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: go run ./cmd/ingest status >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the certificate
        if: always()
        run: rm -f ca.pem
