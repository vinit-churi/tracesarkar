  # ------------------------------------------------------- corporate/blacklist

  - id: mca
    name: MCA21 master data
    url: https://www.mca.gov.in
    category: corporate
    acquisition: api
    cadence: on_demand
    licence: unverified
    terms_reviewed_on: null
    robots_ok: null
    archive_prefix: s3://tracesarkar-archive/mca/
    status: planned
    notes: >
      CIN is the authoritative contractor identity key. DIN enables corporate-lineage
      detection. Publication of director overlaps requires DIN matching — name
      matching alone is not publishable (common names).

  - id: blacklist_notices
    name: Municipal contractor blacklisting notices
    url: null                      # per corporation
    category: corporate
    acquisition: scrape
