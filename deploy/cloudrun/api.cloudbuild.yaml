# Builds the HTTP surface from Dockerfile.api.
#
# A plain `gcloud builds submit --tag` would use the repository's default
# Dockerfile, which builds the collector. These are different binaries with
# different lifecycles, so the API's build has to name its own file.

steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'Dockerfile.api', '-t', '${_IMAGE}', '.']

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
